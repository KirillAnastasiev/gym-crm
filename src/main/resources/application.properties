# Application properties
spring.application.name=GymCRM
spring.profiles.active=dev

# Server settings
server.port=8080
server.servlet.context-path=/GymCRM

# Actuator settings
management.endpoints.web.exposure.include=health, info, metrics, prometheus, env, threaddump, loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Health indicators
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# Metrics settings
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Prometheus settings
management.prometheus.metrics.export.enabled=true

# OpenAPI settings
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.version=openapi_3_1
springdoc.enable-hateoas=true
springdoc.enable-default-api-docs=true
springdoc.writer-with-default-pretty-printer=true