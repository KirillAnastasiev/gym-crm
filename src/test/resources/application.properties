# Connection pool settings
datasource.url=jdbc:h2:mem:gym-testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
datasource.schema=public
datasource.username=sa
datasource.password=
datasource.driver-class-name=org.h2.Driver
datasource.connection-pool.maximum-size=10

# Persistence settings
persistence.unit-name=gym-persistence-unit-test
persistence.show-sql=true
persistence.format-sql=true
persistence.generate-ddl=false
persistence.database-platform=h2

# JWT settings
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurpose123456
jwt.access.expiration-seconds=3600
jwt.refresh.expiration-seconds=1296000