# Connection pool settings
spring.jpa.database=H2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:gym-testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

# Persistence settings
spring.jpa.properties.hibernate.ejb.persistenceUnitName=gym-persistence-unit
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.test.sql
spring.sql.init.data-locations=classpath:data.test.sql
spring.jpa.hibernate.ddl-auto=none

# JWT settings
app.security.jwt.enabled=false
app.security.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurpose123456
app.security.jwt.access.expiration-seconds=3600
app.security.jwt.refresh.expiration-seconds=1296000

# OpenAPI settings
springdoc.show-actuator=true