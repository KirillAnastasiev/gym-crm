spring:
################### Application properties ####################
  application:
    name: statistics-app
  profiles:
    active: dev

####################### Server settings #######################
server:
  port: 8082

management:
  ###################### Actuator settings ######################
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: always