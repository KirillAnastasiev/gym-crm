spring:
################### Application properties ####################
  application:
    name: statistics-app

####################### Server settings #######################
server:
  port: 8082

############ Eureka Discovery Client settings ################
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
